# Runs the guards this repo already carries, on every push and pull request.
#
# Eight gates now: two dependency audits, Pint, the generated-enum check,
# PHPStan, PHPUnit, vue-tsc, Vitest and the Vite build. The audits are the only
# two that can fail without anybody touching the code — an advisory is
# published, not committed — which is exactly why they belong on every run
# rather than in somebody's memory.
#
# The suite has always existed — 48 feature test files, ~855 test methods, and
# the named invariant guards (ExportScopingTest, FieldOfficeScopingTest,
# ScanLinkTest, TrustProxiesTest) that CLAUDE.md points at as the enforcement
# for field-office scoping, the public scan door and proxy trust. Until this
# file it all only ran when somebody remembered to type `composer test`, which
# means the guards protected the branch exactly as often as a person recalled
# them. Now they protect it on every change.
#
# `npm run build` is in here for a reason beyond packaging: with no type
# checking across the Inertia boundary, the Vue compiler is the only thing in
# CI that reads a template at all. Be clear about its limit, though — it
# catches syntax, not semantics. A `defineProps` whose result is never bound to
# `props` compiles clean, ships, and renders a blank page; that happened in this
# repo on 2026-08-29 and only the browser console caught it. A green build here
# means "it compiled", never "it works". Closing that gap is what type checking
# across the Inertia boundary would buy, and this workflow is where a
# `vue-tsc --noEmit` step would go.

name: CI

on:
  push:
    branches: [main, v1-parity-port]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant, so
# cancel it rather than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — Pint + PHPStan + PHPUnit
    runs-on: ubuntu-latest

    services:
      # tests/TestCase.php creates csc_tims_test itself on first boot, so this
      # only has to be a reachable server with the credentials phpunit.xml
      # pins (root, empty password).
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # gd downscales profile photos and avatars, zip builds tims:backup,
          # dom/mbstring are dompdf's, pdo_mysql is the suite's.
          extensions: gd, zip, dom, mbstring, pdo_mysql, bcmath, fileinfo
          # The oversized-upload fixture in ProfilePhotoTest needs more than a
          # stock 128M; phpunit.xml pins the same value for the child process.
          ini-values: memory_limit=512M
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Supply chain. Both are clean today; nothing would have said so when that
      # changed, and a newly disclosed Laravel advisory would have landed
      # silently. Advisories are the one CI failure that can appear without
      # anybody touching the code, which is exactly why it belongs here.
      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Check formatting
        run: vendor/bin/pint --test

      # The generated enum vocabulary must match the PHP it mirrors. Without
      # this a renamed case is a green build and a filter that silently stops
      # matching in the browser.
      - name: Check generated TypeScript is current
        run: php artisan tims:types --check

      # Level 5 against phpstan-baseline.neon, so this reports only what is
      # newly broken rather than the pre-existing Eloquent-generics findings the
      # baseline records (919 at the last regeneration; see CLAUDE.md).
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run the test suite
        run: php artisan test

  js:
    name: JS — types + Vitest + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` requires package-lock.json to describe this platform
      # completely, and that is why package.json carries no
      # optionalDependencies — a constraint worth stating, because the obvious
      # thing to do is add one back.
      #
      # It used to hold @laravel/multiplex, the terminal multiplexer `php
      # artisan dev` prefers, declaring os: [darwin, linux]. This repo is
      # developed on Windows, where npm resolves that package for the host,
      # finds it unusable, and writes no entry for its own dependency on react.
      # On an ubuntu runner the package *is* applicable, so `npm ci` computes a
      # tree needing react@19 and aborts with "Missing: react@19.2.8 from lock
      # file". The lock is not stale: npm on Windows cannot describe a platform
      # it was not generated on, and neither --os=linux nor `npm install`
      # repairs it. --omit=optional does not either — npm checks that the lock
      # and package.json agree *before* it applies omit filters.
      #
      # So the dependency is gone rather than worked around. DevCommand falls
      # back to runViaConcurrently(), and `concurrently` is a devDependency
      # already, so `composer dev` still works — it was never installable on
      # this repo's own development platform anyway.
      - name: Install JS dependencies
        run: npm ci

      # --audit-level=high so a low-severity advisory in a build-only tool does
      # not block a security fix from shipping.
      - name: Audit JS dependencies
        run: npm audit --audit-level=high

      # Type checking across the Inertia boundary. Currently this only reads
      # files that opt in (.ts, or <script setup lang="ts">), which is what makes
      # the adoption gradual — but it is already enough to reject a status
      # literal the server would never send.
      - name: Type check
        run: npm run typecheck

      - name: Run Vitest
        run: npm run test

      # The build is a correctness check here, not a packaging step: a Vue
      # template error is a build failure and nothing else in CI would see it.
      - name: Build assets
        run: npm run build
